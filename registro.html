<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca — Registrarse</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>
<body class="pagina-login">
  <header class="cabecera">
    <div class="cabecera__contenedor">
      <a href="index.html" class="cabecera__marca">
        <span class="cabecera__icono" aria-hidden="true">📚</span>
        Biblioteca
      </a>
      <nav class="nav-principal" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="login.html">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="contenido-principal">
    <div class="login-card">
      <h1>Registrarse</h1>
      <p>Completa tus datos para crear tu cuenta de acceso a la biblioteca.</p>

      <form id="formulario-registro" class="login-form" action="#" method="post" novalidate>
        <label for="registro-nombre">Nombre y Apellido</label>
        <input
          type="text"
          id="registro-nombre"
          name="nombre"
          required
          placeholder="Tu nombre completo"
        >

        <label for="registro-correo">Correo</label>
        <input
          type="email"
          id="registro-correo"
          name="correo"
          required
          placeholder="tucorreo@gmail.com"
        >

        <label for="registro-clave">Contraseña</label>
        <div class="campo-password">
          <input
            type="password"
            id="registro-clave"
            name="clave"
            required
            placeholder="Crea una contraseña"
          >
          <button type="button" class="btn-ojo" data-toggle-password="registro-clave" aria-label="Mostrar contraseña">
            <i class="fi fi-rr-eye" aria-hidden="true"></i>
          </button>
        </div>

        <label for="registro-clave2">Verificar contraseña</label>
        <div class="campo-password">
          <input
            type="password"
            id="registro-clave2"
            name="clave2"
            required
            placeholder="Repite la contraseña"
          >
          <button type="button" class="btn-ojo" data-toggle-password="registro-clave2" aria-label="Mostrar verificación de contraseña">
            <i class="fi fi-rr-eye" aria-hidden="true"></i>
          </button>
        </div>

        <button type="submit" class="boton boton--primario">Crear cuenta</button>
      </form>

      <div id="registro-exito" class="registro-exito" hidden>
        <p>Tu cuenta a sido creada con exito. ¿Deseas ingresar?</p>
        <a href="login.html" class="boton boton--primario">Ir a iniciar sesión</a>
      </div>

      <a href="login.html" class="login-volver">← Volver a iniciar sesión</a>
    </div>
  </main>

  <footer class="pie">
    <p>Biblioteca — Registro de usuarios</p>
  </footer>

  <script src="js/datos-usuarios.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
